<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제19회 여주도자기 화인회전 | 여주도자기 화인회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="../../" class="logo">여주도자기 화인회<small>YEOJU CERAMICS HWAINHOE</small></a>
    <nav class="nav">
      <a href="../../#exhibition" class="on">현재 전시</a>
      <a href="../../#about">화인회 소개</a>
      <a href="../../#archive">지난 전시</a>
      <a href="../../#artists">회원 작가</a>
      <a href="../../#contact">문의</a>
    </nav>
    <button class="menu-btn" aria-label="메뉴">☰</button>
  </div>
</header>

<section class="ex-head">
  <div class="wrap">
    <p class="eyebrow">Exhibition No. 19</p>
    <h1>제19회 여주도자기 화인회전</h1>
    <div class="meta">
      <span><b>기간</b><span class="todo">[YYYY.MM.DD – MM.DD]</span></span>
      <span><b>장소</b><span class="todo">[전시 장소]</span></span>
      <span><b>참여</b><span class="todo">[참여 작가]</span></span>
    </div>
  </div>
</section>

<section>
  <div class="wrap">
    <p class="statement"><span class="todo">[전시 서문 — 작품 폴더의 자료로 채웁니다]</span></p>

    <div class="filter"></div>

    <!-- 작품 목록: 작품 1점당 아래 블록 하나. data-artist 값으로 작가별 필터가 자동 생성됩니다 -->
    <div class="works">
      <figure class="work" data-artist="작가 A">
        <div class="img placeholder" style="aspect-ratio:4/5">작품 사진</div>
        <figcaption class="cap"><b>작품명</b><span>작가 A · 재료/기법 · 크기 · 연도</span></figcaption>
      </figure>
      <figure class="work" data-artist="작가 B">
        <div class="img placeholder" style="aspect-ratio:1/1">작품 사진</div>
        <figcaption class="cap"><b>작품명</b><span>작가 B · 재료/기법 · 크기 · 연도</span></figcaption>
      </figure>
      <figure class="work" data-artist="작가 A">
        <div class="img placeholder" style="aspect-ratio:3/4">작품 사진</div>
        <figcaption class="cap"><b>작품명</b><span>작가 A · 재료/기법 · 크기 · 연도</span></figcaption>
      </figure>
    </div>

    <p style="margin-top:48px;text-align:center"><a href="../../#contact" class="btn">작품 문의하기</a></p>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <span>© <span data-year></span> 여주도자기 화인회</span>
    <span>경기도 여주시</span>
  </div>
</footer>

<script src="../../assets/js/main.js"></script>
</body>
</html>
